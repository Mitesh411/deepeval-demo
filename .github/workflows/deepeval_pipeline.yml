name: DeepEval OpenRouter Pipeline

on:
  workflow_dispatch:
    inputs:
      openrouter_model:
        description: 'OpenRouter Model Name'
        required: false
        default: 'openai/gpt-4o-mini'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate:
    name: Run DeepEval Evaluation & Publish Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DeepEval Evaluation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ github.event.inputs.openrouter_model || 'openai/gpt-4o-mini' }}
        run: |
          python run_eval.py || true

      - name: Upload HTML Evaluation Reports & Zip Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-html-reports
          path: |
            reports/*.html
            deepeval_results.zip
          retention-days: 30
